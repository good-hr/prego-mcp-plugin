interface:
  display_name: "Payroll Readiness"
  short_description: "Read Prego payroll readiness without changes"
  default_prompt: "Use $payroll-readiness to check whether this payroll is ready to calculate."
dependencies:
  tools:
    - type: "mcp"
      value: "prego"
      description: "Prego read-only HR operations MCP server"
      transport: "streamable_http"
      url: "https://api.prego.team/mcp"
policy:
  allow_implicit_invocation: true
