interface:
  display_name: "Company HR Briefing"
  short_description: "Brief leaders on sourced Prego HR signals"
  default_prompt: "Use $company-briefing to brief me on our company's workforce and HR operating signals."
dependencies:
  tools:
    - type: "mcp"
      value: "prego"
      description: "Prego workforce and HR operations MCP server"
      transport: "streamable_http"
      url: "https://api.prego.team/mcp"
policy:
  allow_implicit_invocation: true
